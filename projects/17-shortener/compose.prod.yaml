services:
  # ─────────────────────────────────────────────────────────
  # 1. PostgreSQL (same as dev — it is a ready-made image)
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortener} -d ${POSTGRES_DB:-shortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 2. migrate — pulls the pushed image from Docker Hub
  # ─────────────────────────────────────────────────────────
  migrate:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/shortener-backend:latest
    command: python manage.py migrate --noinput
    environment: &django_env
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8092}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8092}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # 3. backend — pulled from Docker Hub (no build!)
  # ─────────────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/shortener-backend:latest
    environment: *django_env
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 4. frontend — pulled from Docker Hub (no build!)
  # ─────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/shortener-frontend:latest
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
