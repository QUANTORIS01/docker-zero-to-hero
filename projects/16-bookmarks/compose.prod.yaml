# ─────────────────────────────────────────────────────────
# Production compose — pulls images from Docker Hub.
# No `build:` here. No source code needed. Just images.
#
# Usage:
#   cp .env.example .env   # then set DOCKERHUB_USERNAME
#   docker login
#   docker compose -f compose.prod.yaml up
# ─────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookmarks}
      POSTGRES_USER: ${POSTGRES_USER:-bookmarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarks_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmarks} -d ${POSTGRES_DB:-bookmarks}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/bookmarks-backend:1.0.0
    command: python manage.py migrate --noinput
    environment: &django_env
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8091}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8091}
      POSTGRES_DB: ${POSTGRES_DB:-bookmarks}
      POSTGRES_USER: ${POSTGRES_USER:-bookmarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarks_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/bookmarks-backend:1.0.0
    environment: *django_env
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/bookmarks-frontend:1.0.0
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
