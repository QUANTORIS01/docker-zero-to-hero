services:
  # ─────────────────────────────────────────────────────────
  # 1. PostgreSQL
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookmarks}
      POSTGRES_USER: ${POSTGRES_USER:-bookmarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarks_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmarks} -d ${POSTGRES_DB:-bookmarks}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 2. migrate — one-shot service (runs migrations, exits)
  # ─────────────────────────────────────────────────────────
  migrate:
    build:
      context: ./backend-django
    command: python manage.py migrate --noinput
    environment: &django_env
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8091}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8091}
      POSTGRES_DB: ${POSTGRES_DB:-bookmarks}
      POSTGRES_USER: ${POSTGRES_USER:-bookmarks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarks_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # 3. backend — Django + Gunicorn (HTTP API)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-django
    environment: *django_env
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 4. frontend — React (multi-stage) + Nginx
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
