services:
  # ----------------------------------------------------------------
  # 1. PostgreSQL — the database
  # ----------------------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskrunner}
      POSTGRES_USER: ${POSTGRES_USER:-taskrunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskrunner_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskrunner} -d ${POSTGRES_DB:-taskrunner}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 2. Redis — the message queue for Celery
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 3. migrate — runs migrations once, then exits
  # ----------------------------------------------------------------
  migrate:
    build:
      context: ./backend-django
    command: python manage.py migrate --noinput
    environment: &django_env
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8089}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8089}
      POSTGRES_DB: ${POSTGRES_DB:-taskrunner}
      POSTGRES_USER: ${POSTGRES_USER:-taskrunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskrunner_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------
  # 4. backend — Django + Gunicorn (HTTP API)
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend-django
    environment: *django_env
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 5. worker — Celery worker (same image as backend, different command)
  # ----------------------------------------------------------------
  worker:
    build:
      context: ./backend-django
    command: celery -A config worker --loglevel=info
    environment: *django_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 6. frontend — React (multi-stage) + Nginx
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-react
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
