# The Django backend runs in the `backend` container on port 8000.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Allow recipe photo uploads up to 20 MB.
    client_max_body_size 20M;

    # The React build output goes here (copied from the builder stage).
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # React Single Page Application
    # ------------------------------------------------------------------
    # `try_files` checks if a file exists at the requested path.
    # If yes, serve it. If not, serve index.html (React Router handles it).
    # This makes client-side routing work (e.g., /recipe/42).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # API requests → Django
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Django admin panel → Django
    # ------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Health check endpoint → Django
    # ------------------------------------------------------------------
    location /health/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ------------------------------------------------------------------
    # Django static files (admin CSS, DRF assets)
    # Served directly by Nginx from the shared volume.
    # ------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Uploaded recipe photos
    # Served directly by Nginx from the shared volume.
    # ------------------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
