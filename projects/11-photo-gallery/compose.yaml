services:
  # ----------------------------------------------------------------
  # 1. PostgreSQL — the database
  # ----------------------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photogallery}
      POSTGRES_USER: ${POSTGRES_USER:-photogallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photogallery_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photogallery} -d ${POSTGRES_DB:-photogallery}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 2. web — Django + Gunicorn
  # ----------------------------------------------------------------
  web:
    build: .
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-photogallery}
      POSTGRES_USER: ${POSTGRES_USER:-photogallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photogallery_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------
  # 3. nginx — reverse proxy + static/media server
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/staticfiles:ro
      - media_files:/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  media_files:
