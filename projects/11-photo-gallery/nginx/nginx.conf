# ============================================================
# Photo Gallery — Nginx configuration
# ============================================================

# The Django app runs behind Gunicorn inside the `web` container.
# Gunicorn listens on port 8000. Nginx talks to it over the Docker network.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow image uploads up to 20 MB. The default is 1 MB, which is too small.
    client_max_body_size 20M;

    # ------------------------------------------------------
    # Static files (CSS, JS)
    # Nginx serves these directly from the shared volume.
    # Django's collectstatic puts them in /app/staticfiles,
    # which we mount into this container at /staticfiles.
    # ------------------------------------------------------
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------
    # Media files (user-uploaded photos)
    # Same idea: the web container writes them to /app/media,
    # which we mount here at /media.
    # ------------------------------------------------------
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------
    # Everything else goes to Django (via Gunicorn).
    # ------------------------------------------------------
    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
