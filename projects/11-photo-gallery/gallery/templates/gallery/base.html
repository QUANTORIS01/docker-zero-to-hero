{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aurora Gallery{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'gallery:photo_list' %}" class="logo">
                <span class="logo-mark">◈</span>
                <span class="logo-text">Aurora Gallery</span>
            </a>
            <nav class="nav">
                <a href="{% url 'gallery:photo_list' %}">Gallery</a>
                <a href="/admin/" class="nav-admin">Admin</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Aurora Gallery — a Django + Docker project</p>
    </footer>
</body>
</html>
