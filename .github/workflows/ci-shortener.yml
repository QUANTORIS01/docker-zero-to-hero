name: CI — Shortener

# ─────────────────────────────────────────────────────────
# WHEN to run this workflow
# ─────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'projects/17-shortener/**'
      - '.github/workflows/ci-shortener.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/17-shortener/**'
      - '.github/workflows/ci-shortener.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

# ─────────────────────────────────────────────────────────
# Global environment for all jobs
# ─────────────────────────────────────────────────────────
env:
  PROJECT_DIR: projects/17-shortener
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/shortener

# ─────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────
jobs:
  # ═══════════════════════════════════════════════════════
  # Job 1: Test — verify backend code is valid
  # ═══════════════════════════════════════════════════════
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/backend-django/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/backend-django
        run: pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: ${{ env.PROJECT_DIR }}/backend-django
        env:
          SECRET_KEY: ci-test-only-not-a-real-secret
          DEBUG: "False"
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8092
          CSRF_TRUSTED_ORIGINS: http://localhost:8092
        run: python manage.py check

  # ═══════════════════════════════════════════════════════
  # Job 2: Build + Push — matrix over backend/frontend
  # ═══════════════════════════════════════════════════════
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    # Skip on pull requests (only build on main or on tags)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend-django
          - image: frontend
            context: ./frontend-react
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
